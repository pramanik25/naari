<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin">
  <meta name="theme-color" content="#0A0A12">
  <meta name="color-scheme" content="dark">
  <title>Naari Shakti · Live safety link</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/track.css">
  <script src="/static/i18n.js" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="/static/track.js" defer></script>
</head>
<body class="state-loading">
  <main class="wrap">
    <header class="top">
      <p class="eyebrow"><span data-i18n="brand">Naari Shakti</span> · <span data-i18n="eyebrow_live">Live safety link</span></p>
      <h1 id="title" data-i18n="loading">Loading live location…</h1>
    </header>

    <section id="banner" class="banner" role="status" aria-live="polite">
      <span class="pulse" aria-hidden="true"></span>
      <span id="bannerText"></span>
    </section>

    <section class="stats" aria-label="Status">
      <div class="stat"><p class="eyebrow" data-i18n="label_started">Started</p><p id="started" class="val">—</p></div>
      <div class="stat"><p class="eyebrow" data-i18n="label_battery">Battery</p><p id="battery" class="val">—</p></div>
      <div class="stat"><p class="eyebrow" data-i18n="label_updated">Last update</p><p id="updated" class="val">—</p></div>
      <div class="stat"><p class="eyebrow" data-i18n="label_helpers">Nearby helpers</p><p id="helpers" class="val">—</p></div>
    </section>

    <section class="card mapcard">
      <div id="map" class="map" aria-label="Map"></div>
      <p id="mapNote" class="mapnote" hidden></p>
      <p id="accuracy" class="accuracy muted" hidden></p>
    </section>

    <nav class="actions">
      <a id="gmaps" class="btn primary disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true"
         data-i18n="open_maps">Open in Google Maps</a>
      <a class="btn ghost" href="tel:112" data-i18n="call_112">Call 112</a>
    </nav>

    <section class="card">
      <p class="eyebrow" data-i18n="evidence_title">Verified evidence</p>
      <div id="gallery" class="gallery"></div>
      <p id="evidenceEmpty" class="muted" data-i18n="evidence_empty">No verified evidence yet.</p>
    </section>

    <footer class="foot muted">
      <p id="liveNote" data-i18n="live_note">Updates every 10 seconds.</p>
      <p data-i18n="privacy">This link is private. Share it only with people who can help.</p>
    </footer>
  </main>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
